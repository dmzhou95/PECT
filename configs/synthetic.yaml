
data:
  format: npz
  path: data/synthetic/section.npz
  n_clusters: 5
  n_hvg: 500
  max_genes_per_spot: 32
  n_pca: 30
  radius_um: 150.0
backbone:
  cache_dir: cache/toy
  adapter_blocks: [3, 4]
model:
  d_g: 32
  gate_hidden: 32
  d_a: 32
  d_c: 64
  rank: 8
  dec_hidden: 64
train:
  device: cpu
  batch_size: 128
  infer_batch_size: 256
  max_epochs: 8
  patience: 3
  token_chunk: 2048
  cluster_method: gmm
  log_every: 1
